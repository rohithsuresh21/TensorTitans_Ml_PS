services:
  sentineliq:
    build: .
    image: sentineliq:latest
    container_name: sentineliq
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: prod
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_PATH: /app/data/sentineliq.db
      EVIDENCE_DIR: /app/data/evidence
      MEDIA_DIR: /app/data/media
      MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models:ro
      - ./videos:/app/videos:ro
      - sentineliq-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  sentineliq-data: