<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SentinelIQ{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { display: ['Orbitron','sans-serif'], sans: ['Manrope','sans-serif'], mono: ['JetBrains Mono','monospace'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-[#05070d] text-slate-200 font-sans min-h-screen relative overflow-x-hidden">

  <nav class="sticky top-0 z-40 backdrop-blur-xl border-b border-white/5 bg-[#05070d]/70 px-5 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="/static/icon.svg" alt="SentinelIQ" class="w-9 h-9 drop-shadow-[0_0_12px_rgba(52,211,153,0.5)]" />
      <span class="font-display font-bold tracking-[0.25em] text-lg text-white">
        SENTINEL<span class="text-emerald-400">IQ</span>
      </span>
      <span class="hidden md:inline-block text-[10px] font-mono tracking-widest text-slate-500 border border-white/10 rounded px-1.5 py-0.5 ml-1">LOCAL GW</span>
    </div>

    <div class="flex items-center gap-2 md:gap-3">
      {% if request.cookies.get('session') %}
        <a href="/dashboard" class="px-3 py-1.5 text-xs rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition {{ 'text-emerald-400 border-emerald-400/30 bg-emerald-400/5' if active == 'dashboard' }}">Command</a>
        <a href="/zone-picker" class="px-3 py-1.5 text-xs rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition {{ 'text-emerald-400 border-emerald-400/30 bg-emerald-400/5' if active == 'picker' }}">Zones</a>
        <a href="/settings" class="px-3 py-1.5 text-xs rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition {{ 'text-emerald-400 border-emerald-400/30 bg-emerald-400/5' if active == 'settings' }}">Settings</a>
        <a href="/logout" class="px-3 py-1.5 text-xs rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 border border-red-500/20 transition">Sign out</a>
      {% endif %}
    </div>
  </nav>

  <main class="relative z-10 max-w-[1600px] mx-auto p-4 md:p-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="relative z-10 max-w-[1600px] mx-auto px-6 pb-6 flex items-center justify-between text-[10px] font-mono text-slate-600">
    <span>&#9664; PRESENT-CONTEXT TELEMETRY</span>
    <span>TensorTitans ML · SentinelIQ v2</span>
  </footer>
</body>
</html>
